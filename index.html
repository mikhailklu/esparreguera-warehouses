<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Warehouse selector (NAU 1–6, NAU 16, Fornal 31) based on project floor plans. Measured, derived and assumed values are marked." />
    <title>Warehouse selector — Esparreguera</title>
  </head>
  <body>
    <div class="banner" role="note">
      <strong lang="es">Basado en planos de proyecto; no es un levantamiento.</strong>
      <span data-i18n="banner"></span>
    </div>

    <div class="app">
      <aside class="sidebar" aria-label="Warehouse selection">
        <header>
          <div class="head-row">
            <h1 data-i18n="h1"></h1>
            <div id="lang-seg" class="seg small" role="group" aria-label="Language / Язык">
              <button type="button" data-lang="en">EN</button>
              <button type="button" data-lang="ru">RU</button>
            </div>
          </div>
          <p class="sub" data-i18n="sub"></p>
        </header>

        <section id="caveats" class="caveats" role="note" aria-labelledby="caveats-title">
          <h2 id="caveats-title" data-i18n="caveatsTitle"></h2>
          <ul id="caveat-list"></ul>
        </section>

        <section>
          <h2 data-i18n="units"></h2>
          <ul id="unit-list" class="unit-list"></ul>
        </section>

        <section>
          <h2 data-i18n="level"></h2>
          <div id="floor-seg" class="seg" role="group"></div>
        </section>

        <section id="details" class="details" aria-live="polite"></section>

        <section id="capacity" class="capacity" aria-labelledby="cap-title"></section>

        <section>
          <h2 data-i18n="legend"></h2>
          <div id="legend" class="legend"></div>
        </section>
      </aside>

      <main class="stage">
        <div class="toolbar">
          <div id="view-seg" class="seg" role="group">
            <button type="button" data-view="plan" aria-pressed="true" data-i18n="view2d"></button>
            <button type="button" data-view="3d" aria-pressed="false" data-i18n="view3d"></button>
          </div>
          <button type="button" id="boxes-toggle" class="btn toggle" aria-pressed="true" data-i18n="capShow"></button>
          <div class="seg-wrap">
            <span class="seg-label" id="levels-label" data-i18n="capLevels"></span>
            <div id="levels-seg" class="seg" role="group" aria-labelledby="levels-label">
              <button type="button" data-levels="4" aria-pressed="true">4</button>
              <button type="button" data-levels="6" aria-pressed="false">6</button>
            </div>
          </div>
          <button type="button" id="reset" class="btn" data-i18n="reset"></button>
          <span class="stamp" data-i18n="stamp"></span>
        </div>

        <div id="plan-view" class="view"></div>
        <div id="three-view" class="view" hidden>
          <div class="notice3d" role="note">
            <span lang="es">Basado en planos de proyecto; no es un levantamiento.</span>
            <span id="notice3d-heights" class="notice3d-sub"></span>
            <span id="notice3d-boxes" class="notice3d-sub"></span>
          </div>
          <div class="hint" data-i18n="hint3d"></div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
